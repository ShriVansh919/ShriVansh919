<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="120" viewBox="0 0 640 120">
  <defs>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#79c0ff"/>
      <stop offset="100%" stop-color="#58a6ff"/>
      <animate attributeName="x1" values="0;1;0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="namegrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e6edf3"/>
      <stop offset="50%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#e6edf3"/>
      <animate attributeName="x2" values="0.3;1;0.3" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <text x="20" y="58" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="url(#namegrad)">Shri Vansh</text>

  <line x1="20" y1="76" x2="340" y2="76" stroke="url(#shimmer)" stroke-width="3" stroke-linecap="round"/>

  <text x="20" y="102" font-family="'Fira Code', monospace" font-size="16" fill="#8b949e">
    CS student · full-stack · building in public
    <animate attributeName="opacity" values="0;0;1" dur="1.2s" fill="freeze"/>
  </text>
</svg>